<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Outer Glow Ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Outer Ring Base -->
  <circle cx="128" cy="128" r="84" fill="#181E2E" stroke="url(#ringGrad)" stroke-width="6"/>

  <!-- Stylized Wheel Slices -->
  <!-- Segment 1: Indigo -->
  <path d="M 128 128 L 128 48 A 80 80 0 0 1 184.57 71.43 Z" fill="#6366F1"/>
  <!-- Segment 2: Violet -->
  <path d="M 128 128 L 184.57 71.43 A 80 80 0 0 1 208 128 Z" fill="#8B5CF6"/>
  <!-- Segment 3: Pink -->
  <path d="M 128 128 L 208 128 A 80 80 0 0 1 184.57 184.57 Z" fill="#EC4899"/>
  <!-- Segment 4: Amber -->
  <path d="M 128 128 L 184.57 184.57 A 80 80 0 0 1 128 208 Z" fill="#F59E0B"/>
  <!-- Segment 5: Emerald -->
  <path d="M 128 128 L 128 208 A 80 80 0 0 1 71.43 184.57 Z" fill="#10B981"/>
  <!-- Segment 6: Teal -->
  <path d="M 128 128 L 71.43 184.57 A 80 80 0 0 1 48 128 Z" fill="#14B8A6"/>
  <!-- Segment 7: Cyan -->
  <path d="M 128 128 L 48 128 A 80 80 0 0 1 71.43 71.43 Z" fill="#06B6D4"/>
  <!-- Segment 8: Blue -->
  <path d="M 128 128 L 71.43 71.43 A 80 80 0 0 1 128 48 Z" fill="#3B82F6"/>

  <!-- Peg dots on border -->
  <circle cx="128" cy="48" r="3" fill="#FFFFFF"/>
  <circle cx="184.57" cy="71.43" r="3" fill="#FFFFFF"/>
  <circle cx="208" cy="128" r="3" fill="#FFFFFF"/>
  <circle cx="184.57" cy="184.57" r="3" fill="#FFFFFF"/>
  <circle cx="128" cy="208" r="3" fill="#FFFFFF"/>
  <circle cx="71.43" cy="184.57" r="3" fill="#FFFFFF"/>
  <circle cx="48" cy="128" r="3" fill="#FFFFFF"/>
  <circle cx="71.43" cy="71.43" r="3" fill="#FFFFFF"/>

  <!-- Center Hub -->
  <circle cx="128" cy="128" r="30" fill="#0F172A" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="128" cy="128" r="14" fill="#6366F1"/>

  <!-- Top Pointer Arrow (Clean geometric path pointing down) -->
  <path d="M 128 42 L 138 22 C 139 20 137 18 135 18 L 121 18 C 119 18 117 20 118 22 Z" fill="url(#needleGrad)" stroke="#0F172A" stroke-width="2"/>
  <circle cx="128" cy="25" r="2.5" fill="#4F46E5"/>
</svg>
